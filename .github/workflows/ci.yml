name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The standalone binary, into a runner-owned folder: system paths are not
      # writable on every image, and 'az bicep install' locations vary.
      - name: Install the Bicep CLI
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'bicep-bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $asset = if ($IsWindows) { 'bicep-win-x64.exe' } else { 'bicep-linux-x64' }
          $exe = Join-Path $bin $(if ($IsWindows) { 'bicep.exe' } else { 'bicep' })
          Invoke-WebRequest "https://github.com/Azure/bicep/releases/latest/download/$asset" -OutFile $exe
          if (-not $IsWindows) { chmod +x $exe }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & $exe --version

      - name: Unit tests (no Azure)
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

      - name: End-to-end tests (mocked Azure)
        shell: pwsh
        run: ./tests/Invoke-EndToEndTest.ps1
